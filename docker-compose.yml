services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: ["5433:5432"]
    environment:
      POSTGRES_DB: santri_permit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d santri_permit"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  api:
    build: ./apps/api
    ports: ["3001:3001"]
    env_file: apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./apps/web
    ports: ["3000:3000"]
    env_file: apps/web/.env
volumes: { pgdata: {} }
