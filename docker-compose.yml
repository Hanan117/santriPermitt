services:
  postgres:
    image: postgres:16-alpine
    ports: ["5433:5432"]
    environment:
      POSTGRES_DB: santri_permit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./apps/api
    ports: ["3001:3001"]
    env_file: apps/api/.env
    depends_on: [postgres]
  web:
    build: ./apps/web
    ports: ["3000:3000"]
    env_file: apps/web/.env
volumes: { pgdata: {} }
